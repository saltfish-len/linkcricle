<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkCircle · 圆点遍历最短路径工具</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --accent: #ff2442;
    --text: #222;
    --muted: #888;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header h1 { font-size: 18px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 13px; }
  main {
    display: flex;
    gap: 16px;
    padding: 16px 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  #stage {
    flex: 1 1 600px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #stage.dragover { outline: 3px dashed var(--accent); outline-offset: -10px; }
  #dropHint { text-align: center; color: var(--muted); padding: 60px 20px; }
  #dropHint strong { color: var(--text); font-size: 16px; display: block; margin-bottom: 8px; }
  #canvas { max-width: 100%; height: auto; display: none; border-radius: 12px; }
  aside {
    flex: 0 0 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 { font-size: 14px; margin-bottom: 12px; }
  .row { margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row label output { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--card);
    color: var(--text);
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .check input { accent-color: var(--accent); }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    background: #f0f1f3;
    color: var(--text);
    margin-bottom: 8px;
  }
  button:last-child { margin-bottom: 0; }
  button.primary { background: var(--accent); color: #fff; }
  button:hover { filter: brightness(0.95); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #stats { font-size: 13px; line-height: 2; }
  #stats b { font-variant-numeric: tabular-nums; }
  #stats .dim { color: var(--muted); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Link<span>Circle</span></h1>
  <p>上传圆点图 → 自动识别每个圆 → 计算遍历全部圆的最短路径（TSP：快速近似 / 精确最优）</p>
</header>
<main>
  <div id="stage">
    <div id="dropHint">
      <strong>点击 / 拖拽 / 粘贴 图片到这里</strong>
      支持白底（或纯色底）上的圆点图，例如截图里的蓝点图<br>
      所有计算都在浏览器本地完成，图片不会上传到任何服务器
    </div>
    <canvas id="canvas"></canvas>
  </div>
  <aside>
    <div class="card">
      <h2>参数</h2>
      <div class="row">
        <label>识别灵敏度（与背景色差阈值）<output id="thresholdVal">60</output></label>
        <input type="range" id="threshold" min="15" max="150" value="60">
      </div>
      <div class="row">
        <label>最小圆面积（像素）<output id="minAreaVal">40</output></label>
        <input type="range" id="minArea" min="5" max="500" value="40">
      </div>
      <div class="row">
        <label>求解算法</label>
        <select id="algo">
          <option value="approx">快速近似（最近邻 + 2-opt）</option>
          <option value="exact">精确最优（保证最优解，点多时较慢）</option>
        </select>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="closed"> 闭环路径（走完回到起点）</label>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="showLabels" checked> 显示访问顺序编号</label>
      </div>
    </div>
    <div class="card">
      <button class="primary" id="pickBtn">选择图片</button>
      <button id="demoBtn">生成示例图试一试</button>
      <button id="downloadBtn" disabled>下载结果图</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="card">
      <h2>结果</h2>
      <div id="stats"><span class="dim">还没有图片</span></div>
      <button id="stopBtn" style="display:none; margin-top:12px">停止求解（保留当前最优）</button>
    </div>
  </aside>
</main>

<script>
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const dropHint = document.getElementById("dropHint");
const statsEl = document.getElementById("stats");
const fileInput = document.getElementById("fileInput");
const downloadBtn = document.getElementById("downloadBtn");

let sourceImage = null;   // 当前原图（Image 或 canvas）
let circles = [];         // 识别出的圆 {x, y, r, area}
let order = [];           // 访问顺序（circles 的下标）
let pathLength = 0;
let animToken = 0;        // 用于打断进行中的路径动画

// ---------- 输入：选择 / 拖拽 / 粘贴 ----------

document.getElementById("pickBtn").onclick = () => fileInput.click();
stage.addEventListener("click", () => { if (!sourceImage) fileInput.click(); });
fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); };

stage.addEventListener("dragover", e => { e.preventDefault(); stage.classList.add("dragover"); });
stage.addEventListener("dragleave", () => stage.classList.remove("dragover"));
stage.addEventListener("drop", e => {
  e.preventDefault();
  stage.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith("image/")) loadFile(file);
});
window.addEventListener("paste", e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith("image/")) { loadFile(item.getAsFile()); break; }
  }
});

function loadFile(file) {
  const img = new Image();
  img.onload = () => { URL.revokeObjectURL(img.src); setImage(img); };
  img.src = URL.createObjectURL(file);
}

function setImage(img) {
  sourceImage = img;
  canvas.width = img.width;
  canvas.height = img.height;
  canvas.style.display = "block";
  dropHint.style.display = "none";
  run();
}

// ---------- 参数变化时重新计算 ----------

for (const id of ["threshold", "minArea"]) {
  const input = document.getElementById(id);
  const out = document.getElementById(id + "Val");
  input.oninput = () => { out.textContent = input.value; if (sourceImage) run(); };
}
document.getElementById("closed").onchange = () => { if (sourceImage) run(); };
document.getElementById("algo").onchange = () => { if (sourceImage) run(); };
document.getElementById("showLabels").onchange = () => { if (sourceImage) render(order.length, false); };

// ---------- 主流程：圆识别在主线程，TSP 求解放在 Web Worker 里，不阻塞界面 ----------

const stopBtn = document.getElementById("stopBtn");
let worker = null;
let solve = null; // 当前求解状态 {algo, closed, n, explored, lb, t0}

let runTimer = 0;
function run() {
  // 先让"计算中"渲染出来；同时给滑杆拖动做防抖
  statsEl.innerHTML = '<span class="dim">计算中…</span>';
  clearTimeout(runTimer);
  runTimer = setTimeout(doRun, 30);
}

function doRun() {
  ctx.drawImage(sourceImage, 0, 0);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

  circles = detectCircles(
    imageData,
    Number(document.getElementById("threshold").value),
    Number(document.getElementById("minArea").value)
  );

  if (worker) { worker.terminate(); worker = null; }
  stopBtn.style.display = "none";
  downloadBtn.disabled = circles.length === 0;
  order = [];
  pathLength = 0;

  if (circles.length === 0) {
    statsEl.innerHTML = '<span class="dim">没有识别到圆，试着调高灵敏度或调低最小面积</span>';
    render(0, false);
    return;
  }

  solve = {
    algo: document.getElementById("algo").value,
    closed: document.getElementById("closed").checked,
    n: circles.length,
    explored: 0,
    lb: 0,
    t0: performance.now()
  };
  worker = new Worker(workerURL);
  worker.onmessage = onWorkerMessage;
  worker.postMessage({
    points: circles.map(c => ({ x: c.x, y: c.y })),
    closed: solve.closed,
    algo: solve.algo
  });
}

function onWorkerMessage(e) {
  const m = e.data;
  if (m.type === "percent") {
    statsEl.innerHTML =
      `识别到圆：<b>${solve.n}</b> 个<br>` +
      `正在精确求解（动态规划）… <b>${m.percent}</b>%`;
  } else if (m.type === "tick") {
    solve.explored = m.explored;
    if (m.lb) solve.lb = m.lb;
    renderSolvingStats();
  } else if (m.type === "better") {
    order = m.order;
    pathLength = m.length;
    render(order.length, false);
    renderSolvingStats();
    stopBtn.style.display = "block"; // 有可行解之后才能"停止并保留"
  } else if (m.type === "done") {
    worker.terminate();
    worker = null;
    stopBtn.style.display = "none";
    order = m.order;
    pathLength = m.length;
    finishStats(m.optimal, m.method);
    animatePath();
  }
}

stopBtn.onclick = () => {
  if (!worker) return;
  worker.terminate();
  worker = null;
  stopBtn.style.display = "none";
  finishStats(false);
  animatePath();
};

function renderSolvingStats() {
  const lbNote = solve.lb
    ? `已证明下界：<b>${Math.round(solve.lb)}</b> px<br>`
    : "";
  statsEl.innerHTML =
    `识别到圆：<b>${solve.n}</b> 个<br>` +
    `正在精确求解（分支定界）…<br>` +
    `当前最优：<b>${Math.round(pathLength)}</b> px<br>` +
    lbNote +
    `已探索：<b>${(solve.explored / 1e6).toFixed(1)}</b>M 个分支<br>` +
    `<span class="dim">搜索完毕即证明最优，也可随时停止保留当前解</span>`;
}

function finishStats(optimal, method) {
  const elapsed = performance.now() - solve.t0;
  const note = solve.algo === "exact"
    ? (optimal
        ? `精确最优解（${method}，已证明最优）`
        : "已停止，显示目前找到的最短路径（未证明最优）")
    : "TSP 是 NP-hard，快速模式用最近邻 + 2-opt 求近似解";
  statsEl.innerHTML =
    `识别到圆：<b>${solve.n}</b> 个<br>` +
    `路径总长：<b>${Math.round(pathLength)}</b> px<br>` +
    `计算耗时：<b>${elapsed < 10000 ? elapsed.toFixed(0) + " ms" : (elapsed / 1000).toFixed(1) + " s"}</b><br>` +
    `<span class="dim">${note}</span>`;
}

// ---------- 圆识别：背景色估计 → 前景掩码 → 距离变换 → 峰值检测 ----------
// 不用连通域质心：相切/重叠的圆会连成一个连通域被误判成一个大圆。
// 实心圆的圆心是「到背景的距离」的局部极大值点，且峰值恰好等于半径，
// 相切的圆各自保有自己的峰，再按半径做非极大值抑制即可逐个分离出来。

function detectCircles(imageData, threshold, minArea) {
  const { width: w, height: h, data } = imageData;

  // 取四条边的像素估计背景色（圆点图通常是纯色背景）
  let br = 0, bg = 0, bb = 0, n = 0;
  const sampleBg = (x, y) => {
    const i = (y * w + x) * 4;
    br += data[i]; bg += data[i + 1]; bb += data[i + 2]; n++;
  };
  for (let x = 0; x < w; x += 2) { sampleBg(x, 0); sampleBg(x, h - 1); }
  for (let y = 0; y < h; y += 2) { sampleBg(0, y); sampleBg(w - 1, y); }
  br /= n; bg /= n; bb /= n;

  // 与背景色差超过阈值的像素视为前景
  const mask = new Uint8Array(w * h);
  const t2 = threshold * threshold;
  for (let p = 0, i = 0; p < w * h; p++, i += 4) {
    const dr = data[i] - br, dg = data[i + 1] - bg, db = data[i + 2] - bb;
    // 用各通道差的最大值的平方近似，对深色和彩色圆点都稳定
    const d = Math.max(dr * dr, dg * dg, db * db);
    if (d > t2) mask[p] = 1;
  }

  // chamfer 3-4 距离变换（两遍扫描），dt/3 ≈ 该像素到背景的欧氏距离
  const dt = new Int32Array(w * h);
  for (let p = 0; p < w * h; p++) dt[p] = mask[p] ? 0x3fffffff : 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = y * w + x;
      if (dt[p] === 0) continue;
      let v = dt[p];
      if (x > 0) v = Math.min(v, dt[p - 1] + 3);
      if (y > 0) {
        v = Math.min(v, dt[p - w] + 3);
        if (x > 0) v = Math.min(v, dt[p - w - 1] + 4);
        if (x < w - 1) v = Math.min(v, dt[p - w + 1] + 4);
      }
      dt[p] = v;
    }
  }
  for (let y = h - 1; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const p = y * w + x;
      if (dt[p] === 0) continue;
      let v = dt[p];
      if (x < w - 1) v = Math.min(v, dt[p + 1] + 3);
      if (y < h - 1) {
        v = Math.min(v, dt[p + w] + 3);
        if (x < w - 1) v = Math.min(v, dt[p + w + 1] + 4);
        if (x > 0) v = Math.min(v, dt[p + w - 1] + 4);
      }
      dt[p] = v;
    }
  }

  // 3×3 局部极大值作为圆心候选（最小面积换算成最小半径过滤噪点）
  const minR = Math.max(2, Math.sqrt(minArea / Math.PI));
  const minDT = minR * 3;
  const cands = [];
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const p = y * w + x;
      const v = dt[p];
      if (v < minDT) continue;
      if (v < dt[p - 1] || v < dt[p + 1] || v < dt[p - w] || v < dt[p + w] ||
          v < dt[p - w - 1] || v < dt[p - w + 1] || v < dt[p + w - 1] || v < dt[p + w + 1]) continue;
      cands.push(p);
    }
  }
  cands.sort((a, b) => dt[b] - dt[a]);

  // 非极大值抑制：半径大的先占位，圆心离已有圆太近的候选丢弃
  // （平顶台地产生的重复峰也在这里被合并）
  const result = [];
  for (const p of cands) {
    const x = p % w, y = (p / w) | 0, r = dt[p] / 3;
    let dup = false;
    for (const c of result) {
      if (Math.hypot(c.x - x, c.y - y) < (c.r + r) * 0.7) { dup = true; break; }
    }
    if (dup) continue;

    // 校验：圆盘内前景占比要足够高，排除细长线条等非圆形状的脊线峰
    let fg = 0, tot = 0;
    const ri = Math.max(1, Math.floor(r - 1));
    for (let dy = -ri; dy <= ri; dy++) {
      const yy = y + dy;
      if (yy < 0 || yy >= h) continue;
      const span = Math.floor(Math.sqrt(ri * ri - dy * dy));
      for (let dx = -span; dx <= span; dx++) {
        const xx = x + dx;
        if (xx < 0 || xx >= w) continue;
        tot++;
        if (mask[yy * w + xx]) fg++;
      }
    }
    if (tot === 0 || fg / tot < 0.7) continue;

    // 校验：圆外一圈应主要是背景。相切簇接缝处的伪峰
    // （圆盘内也是前景，能骗过上面的检查）外圈全在别的圆里，在这里被排除；
    // 真圆即使与几个圆相切，外圈也只有接触点附近的小段弧是前景
    let ringFg = 0, ringTot = 0;
    const rr = r * 1.35 + 1.5;
    const steps = Math.max(16, Math.round(rr * 2));
    for (let t = 0; t < steps; t++) {
      const a = (t / steps) * Math.PI * 2;
      const xx = Math.round(x + Math.cos(a) * rr);
      const yy = Math.round(y + Math.sin(a) * rr);
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      ringTot++;
      if (mask[yy * w + xx]) ringFg++;
    }
    if (ringTot > 0 && ringFg / ringTot > 0.5) continue;

    result.push({ x, y, r });
  }
  return result;
}

// ---------- TSP 求解（在 Web Worker 中运行，不阻塞界面） ----------
// 近似：多起点最近邻 + 2-opt。
// 精确：n ≤ 20 用 Held-Karp 动态规划（受 O(n·2ⁿ) 内存约束没法更大）；
//       更多的点用分支定界（MST 下界剪枝），内存 O(n)，慢慢搜直到证明最优。

function solverWorkerMain() {
  "use strict";

  function buildDist(points) {
    const n = points.length;
    const dist = new Float64Array(n * n);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const d = Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y);
        dist[i * n + j] = d;
        dist[j * n + i] = d;
      }
    }
    return dist;
  }

  function tourLength(dist, n, ord, closed) {
    let len = 0;
    for (let i = 1; i < ord.length; i++) len += dist[ord[i - 1] * n + ord[i]];
    if (closed) len += dist[ord[ord.length - 1] * n + ord[0]];
    return len;
  }

  // 近似解：每个起点跑最近邻，取最优，再做 2-opt 优化
  function approx(dist, n, closed, timeBudgetMs) {
    // 最近邻：n 较小时尝试所有起点，较大时只试一部分，控制在 O(n^3) 以内
    const starts = [];
    const maxStarts = n <= 250 ? n : Math.max(1, Math.floor(250 * 250 / n));
    for (let s = 0; s < n; s += Math.max(1, Math.floor(n / maxStarts))) starts.push(s);

    let bestOrder = null, bestLen = Infinity;
    const visited = new Uint8Array(n);
    for (const s of starts) {
      visited.fill(0);
      const ord = [s];
      visited[s] = 1;
      let cur = s, len = 0;
      for (let k = 1; k < n; k++) {
        let next = -1, nd = Infinity;
        const row = cur * n;
        for (let j = 0; j < n; j++) {
          if (!visited[j] && dist[row + j] < nd) { nd = dist[row + j]; next = j; }
        }
        ord.push(next);
        visited[next] = 1;
        len += nd;
        cur = next;
      }
      if (closed) len += dist[cur * n + s];
      if (len < bestLen) { bestLen = len; bestOrder = ord; }
    }

    // 2-opt：反转一段子路径，若总长变短则接受，循环到无改进或超时
    const ord = bestOrder;
    const deadline = performance.now() + timeBudgetMs;
    let improved = true;
    while (improved && performance.now() < deadline) {
      improved = false;
      for (let i = 0; i < n - 1; i++) {
        // 开放路径中 i=0 表示换起点（左侧没有边）；闭环时左邻是末尾节点
        const a = i === 0 ? (closed ? ord[n - 1] : -1) : ord[i - 1];
        for (let j = i + 1; j < n; j++) {
          if (closed && i === 0 && j === n - 1) continue;
          const b = j === n - 1 ? (closed ? ord[0] : -1) : ord[j + 1];
          const before = (a >= 0 ? dist[a * n + ord[i]] : 0) + (b >= 0 ? dist[ord[j] * n + b] : 0);
          const after  = (a >= 0 ? dist[a * n + ord[j]] : 0) + (b >= 0 ? dist[ord[i] * n + b] : 0);
          if (after < before - 1e-9) {
            for (let l = i, r = j; l < r; l++, r--) {
              const tmp = ord[l]; ord[l] = ord[r]; ord[r] = tmp;
            }
            improved = true;
          }
        }
      }
    }
    return ord;
  }

  // 精确解（小规模）：Held-Karp 动态规划，dp[mask][j] = 访问完 mask 中的点、停在 j 的最短长度
  function heldKarp(dist, n, closed) {
    const full = (1 << n) - 1;
    const dp = new Float32Array((1 << n) * n).fill(Infinity);
    const parent = new Int8Array((1 << n) * n).fill(-1);

    // 闭环时路径起点可任取，固定为 0 号点；开放路径起点未知，每个点都可作起点
    if (closed) dp[1 * n + 0] = 0;
    else for (let j = 0; j < n; j++) dp[(1 << j) * n + j] = 0;

    for (let mask = 1; mask < full; mask++) {
      if ((mask & 0xFFFF) === 0) postMessage({ type: "percent", percent: Math.round(mask / full * 100) });
      const base = mask * n;
      for (let j = 0; j < n; j++) {
        const cur = dp[base + j];
        if (cur === Infinity) continue;
        const row = j * n;
        for (let k = 0; k < n; k++) {
          if (mask & (1 << k)) continue;
          const cand = cur + dist[row + k];
          const idx = (mask | (1 << k)) * n + k;
          if (cand < dp[idx]) { dp[idx] = cand; parent[idx] = j; }
        }
      }
    }

    // 终点：闭环取「回到 0 号点」总长最短的，开放路径取 dp 值最小的
    let end = -1, best = Infinity;
    for (let j = 0; j < n; j++) {
      const v = dp[full * n + j] + (closed ? dist[j * n + 0] : 0);
      if (v < best) { best = v; end = j; }
    }

    // 沿 parent 回溯出访问顺序
    const ord = [];
    let mask = full, j = end;
    while (j >= 0) {
      ord.push(j);
      const p = parent[mask * n + j];
      mask ^= 1 << j;
      j = p;
    }
    ord.reverse();
    return { order: ord, length: tourLength(dist, n, ord, closed) };
  }

  // 精确解（大规模）：分支定界。深度优先枚举访问顺序，
  // 用「当前点 ∪ 未访问点 ∪ 起点」的最小生成树作为剩余路程的下界来剪枝，
  // 找到的每个更优可行解都实时上报，搜完整棵树即证明最优。
  function branchAndBound(dist, n, closed) {
    // 开放路径转闭环：加一个到所有点距离为 0 的虚拟点，
    // 经过虚拟点的最优闭环去掉虚拟点即为最优开放路径
    const N = closed ? n : n + 1;
    let D = dist;
    if (!closed) {
      D = new Float64Array(N * N);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++) D[i * N + j] = dist[i * n + j];
    }
    const virtual = closed ? -1 : n;

    const toResult = (cycle) => {
      if (closed) return cycle.slice();
      const i = cycle.indexOf(virtual);
      return cycle.slice(i + 1).concat(cycle.slice(0, i));
    };
    const report = (type) => {
      postMessage({
        type, order: resOrder, length: tourLength(dist, n, resOrder, closed),
        optimal: type === "done", method: "分支定界", explored
      });
    };

    // 先用快速近似拿一个可行解作为初始上界，越紧剪枝越狠
    let explored = 0;
    let bestCycle = approx(D, N, true, 1500);
    let best = tourLength(D, N, bestCycle, true);
    let resOrder = toResult(bestCycle);
    report("better");

    const used = new Uint8Array(N);
    const path = new Int32Array(N);
    path[0] = 0; // 闭环对旋转不变，固定从 0 号点出发
    used[0] = 1;

    // Held-Karp 拉格朗日下界：给每个点学一个惩罚 λᵢ，惩罚距离
    // D'(i,j) = D(i,j) + λᵢ + λⱼ。任何环在 D' 下都包含一个
    // 「V\{0} 的生成树 + 0 号点的两条边」（1-tree），且环上每点度数为 2，
    // 故真实环长 ≥ 1-tree(D') − 2Σλ。注意不能用全图 MST 代替 1-tree：
    // 环有 N 条边、生成树只有 N−1 条，λ 把边权推成负数后那个界会失效。
    // 用次梯度上升（λᵢ 朝度数−2 的方向调）把下界推到最紧，搜索全程共用这组 λ。
    const lambda = new Float64Array(N);
    const mstDeg = new Int32Array(N);
    const mstParent = new Int32Array(N);
    const minEAll = new Float64Array(N);
    const inTreeAll = new Uint8Array(N);
    function oneTreeWithDegrees(lam) {
      // V\{0} 上的 Prim MST
      for (let i = 0; i < N; i++) { minEAll[i] = Infinity; inTreeAll[i] = 0; mstDeg[i] = 0; mstParent[i] = -1; }
      minEAll[1] = 0;
      let total = 0;
      for (let it = 0; it < N - 1; it++) {
        let u = -1, m = Infinity;
        for (let i = 1; i < N; i++) if (!inTreeAll[i] && minEAll[i] < m) { m = minEAll[i]; u = i; }
        inTreeAll[u] = 1;
        total += m;
        if (mstParent[u] > 0) { mstDeg[u]++; mstDeg[mstParent[u]]++; }
        const row = u * N;
        for (let i = 1; i < N; i++) {
          if (inTreeAll[i]) continue;
          const w = D[row + i] + lam[u] + lam[i];
          if (w < minEAll[i]) { minEAll[i] = w; mstParent[i] = u; }
        }
      }
      // 0 号点接上两条最便宜的惩罚边
      let e1 = Infinity, e2 = Infinity, j1 = -1, j2 = -1;
      for (let j = 1; j < N; j++) {
        const w = D[j] + lam[0] + lam[j];
        if (w < e1) { e2 = e1; j2 = j1; e1 = w; j1 = j; }
        else if (w < e2) { e2 = w; j2 = j; }
      }
      mstDeg[0] = 2; mstDeg[j1]++; mstDeg[j2]++;
      return total + e1 + e2;
    }

    let rootLB = 0;
    {
      const lam = new Float64Array(N);
      let step = 1.0, since = 0;
      for (let iter = 0; iter < 300 && step > 1e-4; iter++) {
        const w = oneTreeWithDegrees(lam);
        let sum = 0;
        for (let i = 0; i < N; i++) sum += lam[i];
        const lb = w - 2 * sum;
        if (lb > rootLB + 1e-9) { rootLB = lb; lambda.set(lam); since = 0; }
        else if (++since >= 20) { step /= 2; since = 0; }
        let norm = 0;
        for (let i = 0; i < N; i++) { const g = mstDeg[i] - 2; norm += g * g; }
        if (norm === 0) break; // MST 已是哈密顿环，下界达到最优
        const t = step * Math.max(best - lb, 1e-9) / norm;
        for (let i = 0; i < N; i++) lam[i] += t * (mstDeg[i] - 2);
      }
    }

    // 剩余路程下界：cur →(经所有未访问点)→ 0 的惩罚路径中，
    // 未访问点度数为 2、两端点度数为 1，故
    // 真实剩余 ≥ MST'(cur ∪ 未访问 ∪ 0) − 2Σ_未访问 λ − λ_cur − λ_0
    let sumLam = 0;
    for (let j = 1; j < N; j++) sumLam += lambda[j];
    const nodes = new Int32Array(N + 1);
    const minE = new Float64Array(N + 1);
    const inTree = new Uint8Array(N + 1);
    function lowerBound(cur) {
      let k = 0;
      nodes[k++] = cur;
      if (cur !== 0) nodes[k++] = 0;
      for (let j = 0; j < N; j++) if (!used[j]) nodes[k++] = j;
      if (k <= 1) return 0;
      for (let i = 0; i < k; i++) { minE[i] = Infinity; inTree[i] = 0; }
      minE[0] = 0;
      let total = 0;
      for (let it = 0; it < k; it++) {
        let u = -1, m = Infinity;
        for (let i = 0; i < k; i++) if (!inTree[i] && minE[i] < m) { m = minE[i]; u = i; }
        inTree[u] = 1;
        total += m;
        const nu = nodes[u], row = nu * N;
        for (let i = 0; i < k; i++) {
          if (inTree[i]) continue;
          const ni = nodes[i];
          const w = D[row + ni] + lambda[nu] + lambda[ni];
          if (w < minE[i]) minE[i] = w;
        }
      }
      return total - (2 * sumLam + lambda[cur] + lambda[0]);
    }

    // 预先把每个点的邻居按距离排好，DFS 中按近到远直接扫，免去每个节点的排序和分配
    const nbr = new Int32Array(N * (N - 1));
    {
      const idx = Array.from({ length: N }, (_, i) => i);
      for (let i = 0; i < N; i++) {
        const sorted = idx.filter(j => j !== i).sort((a, b) => D[i * N + a] - D[i * N + b]);
        nbr.set(sorted, i * (N - 1));
      }
    }

    let proven = false; // 上界一旦触到下界即可提前收工
    function dfs(cur, depth, cost) {
      explored++;
      if ((explored & 0x3FFFF) === 0) postMessage({ type: "tick", explored, lb: rootLB });
      if (depth === N) {
        const total = cost + D[cur * N]; // 收尾边：回到 0 号点
        if (total < best - 1e-9) {
          best = total;
          resOrder = toResult(Array.from(path));
          report("better");
          if (best <= rootLB + 1e-6) proven = true;
        }
        return;
      }
      const row = cur * N, nbrBase = cur * (N - 1);
      for (let t = 0; t < N - 1 && !proven; t++) {
        const j = nbr[nbrBase + t];
        if (used[j]) continue;
        const c = cost + D[row + j];
        if (c >= best) continue;
        used[j] = 1;
        sumLam -= lambda[j];
        path[depth] = j;
        if (c + lowerBound(j) < best - 1e-9) dfs(j, depth + 1, c);
        used[j] = 0;
        sumLam += lambda[j];
      }
    }
    if (best > rootLB + 1e-6) dfs(0, 1, 0);
    report("done");
  }

  onmessage = (e) => {
    const { points, closed, algo } = e.data;
    const n = points.length;
    const dist = buildDist(points);
    if (n <= 2) {
      const ord = points.map((_, i) => i);
      postMessage({ type: "done", order: ord, length: tourLength(dist, n, ord, closed), optimal: true, method: "枚举" });
    } else if (algo !== "exact") {
      const ord = approx(dist, n, closed, 2000);
      postMessage({ type: "done", order: ord, length: tourLength(dist, n, ord, closed), optimal: false });
    } else if (n <= 20) {
      const r = heldKarp(dist, n, closed);
      postMessage({ type: "done", order: r.order, length: r.length, optimal: true, method: "Held-Karp 动态规划" });
    } else {
      branchAndBound(dist, n, closed);
    }
  };
}

const workerURL = URL.createObjectURL(
  new Blob(["(" + solverWorkerMain.toString() + ")()"], { type: "text/javascript" })
);

// ---------- 绘制与动画 ----------

function render(visibleSegments, animating) {
  ctx.drawImage(sourceImage, 0, 0);
  const showLabels = document.getElementById("showLabels").checked;
  const closed = document.getElementById("closed").checked;
  const scale = Math.max(1, canvas.width / 800); // 大图按比例加粗线条

  // 路径
  const pts = order.map(i => circles[i]);
  const totalSegments = closed ? pts.length : pts.length - 1;
  const segs = Math.min(visibleSegments, totalSegments);
  if (pts.length > 1 && segs > 0) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i <= segs; i++) {
      const p = pts[i % pts.length];
      ctx.lineTo(p.x, p.y);
    }
    ctx.strokeStyle = "rgba(255, 36, 66, 0.9)";
    ctx.lineWidth = 2.5 * scale;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
  }

  // 圆的标记
  for (let k = 0; k < pts.length; k++) {
    const p = pts[k];
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 2 * scale, 0, Math.PI * 2);
    ctx.strokeStyle = k === 0 ? "#16a34a" : "rgba(255, 36, 66, 0.8)";
    ctx.lineWidth = 2 * scale;
    ctx.stroke();

    if (showLabels && !animating) {
      const fontSize = Math.max(11, 12 * scale);
      ctx.font = `bold ${fontSize}px sans-serif`;
      const label = String(k + 1);
      const tw = ctx.measureText(label).width;
      const lx = p.x + p.r + 4 * scale, ly = p.y - p.r - 4 * scale;
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.fillRect(lx - 2, ly - fontSize, tw + 4, fontSize + 4);
      ctx.fillStyle = "#ff2442";
      ctx.fillText(label, lx, ly);
    }
  }
}

function animatePath() {
  const token = ++animToken;
  const closed = document.getElementById("closed").checked;
  const totalSegments = closed ? order.length : order.length - 1;
  if (totalSegments <= 0) { render(0, false); return; }
  // 路径越长画得越快，整体控制在 1.5 秒左右
  const msPerSegment = Math.min(80, 1500 / totalSegments);
  let seg = 0;
  let last = performance.now();
  const step = (now) => {
    if (token !== animToken) return; // 有新计算，放弃旧动画
    seg += (now - last) / msPerSegment;
    last = now;
    if (seg >= totalSegments) {
      render(totalSegments, false);
      return;
    }
    render(Math.floor(seg), true);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- 示例图生成 ----------

document.getElementById("demoBtn").onclick = () => {
  const w = 960, h = 600;
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const octx = off.getContext("2d");
  octx.fillStyle = "#ffffff";
  octx.fillRect(0, 0, w, h);
  octx.fillStyle = "#5b9bd5";

  const placed = [];
  const draw = (x, y, r) => {
    placed.push({ x, y, r });
    octx.beginPath();
    octx.arc(x, y, r, 0, Math.PI * 2);
    octx.fill();
  };
  let attempts = 0;
  while (placed.length < 12 && attempts++ < 2000) {
    const r = 10 + Math.random() * 18;
    const x = r + 30 + Math.random() * (w - 2 * r - 60);
    const y = r + 30 + Math.random() * (h - 2 * r - 60);
    if (placed.some(c => Math.hypot(c.x - x, c.y - y) < c.r + r + 12)) continue;
    draw(x, y, r);
  }
  // 再附加几个与已有圆相切的圆，模拟密集簇，考验圆分离能力
  attempts = 0;
  while (placed.length < 18 && attempts++ < 2000) {
    const base = placed[(Math.random() * placed.length) | 0];
    const r = 10 + Math.random() * 14;
    const a = Math.random() * Math.PI * 2;
    const x = base.x + Math.cos(a) * (base.r + r);
    const y = base.y + Math.sin(a) * (base.r + r);
    if (x < r + 10 || y < r + 10 || x > w - r - 10 || y > h - r - 10) continue;
    if (placed.some(c => c !== base && Math.hypot(c.x - x, c.y - y) < c.r + r + 4)) continue;
    draw(x, y, r);
  }
  setImage(off);
};
